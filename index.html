<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Air UK – Service Tracker</title>
<meta name="theme-color" content="#1e1e1e">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#1e1e1e;--mut:#6b6b6b;--line:#e3e0dc;--pri:#ff7a1a;--pri2:#fff0e3;--priink:#b04e00;--onpri:#1e1e1e;--red:#d33a2c;--red2:#fdeae7;--amb:#e6b400;--amb2:#fff5cc;--ok:#0f9d58;--ok2:#e0f5ea;--f:'Barlow',system-ui,sans-serif;--h:'Barlow Condensed','Arial Narrow',sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#1e1e1e;border-bottom:3px solid var(--pri);padding:8px 14px}
.top{display:flex;align-items:center;gap:8px}.logo{height:42px;width:auto;display:block}.sp{flex:1}
.add{background:var(--pri);border:0;border-radius:9px;color:var(--onpri);font:700 16px var(--h);padding:9px 13px;cursor:pointer}.add.o{background:#2c2c2c;color:#fff;border:1px solid #444}
main{max-width:820px;margin:auto;padding:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tab{background:var(--pri2);border:2px solid transparent;border-top:5px solid var(--c,var(--pri));border-radius:8px;padding:8px 8px 7px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.tab b{font:700 30px/1 var(--h);display:block}.tab span{font-size:13px;color:var(--mut);display:block;line-height:1.2}
.tab.on{border-color:var(--ink);border-top-color:var(--c,var(--pri));background:#fff;box-shadow:0 2px 0 var(--ink)}
.tab.od{--c:var(--red)}.tab.up{--c:var(--amb)}.tab.dn{--c:var(--ok)}.tab.rn{--c:var(--pri)}
@media(max-width:420px){.tab b{font-size:26px}.tab span{font-size:12px}}
input,select,textarea{width:100%;font:16px var(--f);padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
#q{margin-bottom:12px}
.r{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.r .m{flex:1;min-width:0;cursor:pointer}.r .m b{display:block}.mut{color:var(--mut);font-size:14px}
.db{flex:none;width:52px;text-align:center;border-radius:8px;padding:5px 0;background:var(--c2,var(--pri2));color:var(--c1,var(--priink))}
.db b{font:700 22px/1 var(--h);display:block}.db span{font:600 12px var(--f);text-transform:uppercase}
.od .db,.db.od{--c1:var(--red);--c2:var(--red2)}.db.up{--c1:#7a5c00;--c2:var(--amb2)}.db.dn{--c1:#0b7a43;--c2:var(--ok2)}
.chip{display:inline-block;font:600 12px var(--f);padding:2px 9px;border-radius:12px;white-space:nowrap}
.chip.od{background:var(--red);color:#fff}.chip.up{background:var(--amb2);color:#7a5c00}.chip.dn{background:var(--ok2);color:#0b7a43}.chip.n{background:#efefef;color:var(--mut)}
.go{flex:none;border:0;border-radius:9px;background:var(--pri);color:var(--onpri);font:700 17px var(--h);padding:11px 14px;min-width:92px;cursor:pointer}.go.g2{background:var(--pri2);color:var(--priink)}
.empty{padding:26px 0;color:var(--mut);text-align:center}
.tot{color:var(--mut);font-size:14px;margin:0 0 4px}
dialog{border:0;border-radius:14px;width:min(94vw,480px);background:#fff;color:var(--ink);padding:16px}dialog::backdrop{background:#0008}
dialog h2{font:700 24px var(--h);margin:0 0 8px}label{font-weight:600;font-size:14px;display:block;margin-top:8px}
.btns{display:flex;gap:10px;margin-top:14px}.btns .go{flex:1}.btns .del{background:var(--red2);color:var(--red);flex:none;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1e1e1e;color:#fff;padding:11px 16px;border-radius:24px;z-index:9;font-weight:600;display:flex;gap:14px;align-items:center;max-width:92vw}
.toast button{background:none;border:0;color:var(--pri);font:700 15px var(--f);cursor:pointer}
</style></head><body>

<main><div class="mut" id="ss" style="margin:-4px 0 8px"></div><div class="tabs" id="tb"></div><input id="q" type="search" placeholder="Search customer, site or unit"><div id="ls"></div></main>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),T=new Date();T.setHours(0,0,0,0);
const iso=n=>{let x=new Date(T);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const addM=(s,m)=>{let x=new Date(s);x.setMonth(x.getMonth()+m);return x.toISOString().slice(0,10)};
const dd=s=>Math.round((new Date(s)-T)/864e5),D=s=>new Date(s),gbp=n=>'£'+Math.round(n||0).toLocaleString('en-GB');
const fd=s=>D(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const TY=['PPM visit','F-Gas leak check','Annual service','Reactive follow-up','Other'];
function seed(){return{jb:[],rn:[],tab:'od',ov:{},at:''}}
let S;try{S=JSON.parse(localStorage.getItem('fa-track'))}catch(e){}S=S||seed();S.ov=S.ov||{};
const save=()=>{try{localStorage.setItem('fa-track',JSON.stringify(S))}catch(e){}},uid=()=>Math.random().toString(36).slice(2,8);
function toast(t,u){document.querySelectorAll('.toast').forEach(x=>x.remove());const e=document.createElement('div');e.className='toast';e.innerHTML=`<span>${t}</span>`;if(u){const b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{u();save();render();e.remove()};e.append(b)}document.body.append(e);setTimeout(()=>e.remove(),5000)}
const pl=(n,w)=>n+' '+w+(n===1?'':'s');
const st=j=>{const n=dd(j.d);return n<0?['od',`${pl(-n,'day')} overdue`]:n===0?['up','Due today']:n<=7?['up',`Due in ${pl(n,'day')}`]:['n',`Due in ${pl(n,'day')}`]};
const rs=r=>{const n=dd(r.d);return n<0?['od',`Expired ${pl(-n,'day')} ago`]:n<=30?['od',`Renews in ${pl(n,'day')}`]:n<=60?['up',`Renews in ${pl(n,'day')}`]:['n',`Renews in ${pl(n,'day')}`]};
const blk=(d,c)=>`<div class="db ${c}"><b>${D(d).getDate()}</b><span>${D(d).toLocaleDateString('en-GB',{month:'short'})}</span></div>`;
function lists(){const q=($('#q').value||'').toLowerCase(),m=j=>!q||[j.c,j.s,j.u,j.t,j.n].join(' ').toLowerCase().includes(q);
const open=S.jb.filter(j=>!j.x&&m(j)),all=S.jb.filter(j=>!j.x);
return{od:open.filter(j=>dd(j.d)<0).sort((a,b)=>a.d.localeCompare(b.d)),up:open.filter(j=>dd(j.d)>=0).sort((a,b)=>a.d.localeCompare(b.d)),dn:S.jb.filter(j=>j.x&&m(j)).sort((a,b)=>b.x.localeCompare(a.x)).slice(0,60),rn:S.rn.filter(r=>!q||[r.c,r.n].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.d.localeCompare(b.d)),
c:{od:all.filter(j=>dd(j.d)<0).length,up:all.filter(j=>dd(j.d)>=0).length,w:all.filter(j=>dd(j.d)>=0&&dd(j.d)<=7).length,dn:S.jb.filter(j=>j.x&&dd(j.x)>=-30).length,rn:S.rn.filter(r=>dd(r.d)<=60).length}}}
let busy=0;function render(){const L=lists(),c=L.c,t=S.tab;
if(!busy)$('#ss').textContent=S.at?'Synced with SimPro at '+new Date(S.at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):'Not synced yet';
$('#tb').innerHTML=[['od','Overdue',c.od,'od'],['up','Upcoming',c.up,'up',`${c.w} due in 7 days`],['dn','Completed',c.dn,'dn','last 30 days'],['rn','Renewals',c.rn,'rn','due in 60 days']].map(x=>`<button class="tab ${x[3]} ${t===x[0]?'on':''}" data-a="tab:${x[0]}"><b>${x[2]}</b><span>${x[1]}</span><span>${x[4]||'jobs'}</span></button>`).join('');
const jr=(j,m)=>{const s=m==='dn'?['dn','Completed '+fd(j.x)]:st(j),cl=m==='dn'?'dn':s[0]==='n'?'':s[0];return`<div class="r">${blk(j.d,cl)}<div class="m" data-a="edit:job:${j.id}"><b>${j.s} · ${j.u}</b><span class="mut">${j.c} · ${j.t}${j.ref?' · SimPro #'+j.ref:''}${j.f?' · every '+j.f+'m':''}</span><div><span class="chip ${s[0]}">${s[1]}</span> <span class="mut">${m==='dn'?'was due '+fd(j.d):fd(j.d)}</span></div></div>${m==='dn'?(j.sid?'':`<button class="go g2" data-a="reopen:${j.id}">Reopen</button>`):`<button class="go" data-a="done:${j.id}">Complete</button>`}</div>`};
const rr=r=>{const s=rs(r);return`<div class="r">${blk(r.d,s[0]==='n'?'':s[0])}<div class="m" data-a="edit:rn:${r.id}"><b>${r.c}</b><span class="mut">${r.n} · ${gbp(r.v)}/yr</span><div><span class="chip ${s[0]}">${s[1]}</span> <span class="mut">${fd(r.d)}${r.x?' · last renewed '+fd(r.x):''}</span></div></div><button class="go" data-a="renew:${r.id}">Renew</button></div>`};
const l=L[t],msg={od:'Nothing overdue.',up:'No upcoming jobs.',dn:'No completed jobs yet.',rn:'No renewals.'}[t];
const head={od:'Oldest first',up:'Soonest first',dn:'Most recent first',rn:'Soonest first'}[t];
$('#ls').innerHTML=`<p class="tot">${l.length} shown · ${head}</p>`+(l.length?l.map(x=>t==='rn'?rr(x):jr(x,t)).join(''):`<div class="empty">${msg}</div>`)}
const A={
tab(t){S.tab=t;save();render()},
done(id){const j=S.jb.find(x=>x.id===id),o=j.x;j.x=iso(0);let nx;if(j.sid){S.ov[j.sid]=j.x;api({action:'complete',sid:j.sid,ref:j.ref,customer:j.c,site:j.s,date:j.x}).catch(()=>{});save();render();return toast('Marked complete',()=>{j.x=o;delete S.ov[j.sid]})}if(j.f){let d=addM(j.d,j.f);if(dd(d)<0)d=addM(iso(0),j.f);nx={...j,id:uid(),d,x:''};S.jb.push(nx)}save();render();toast(nx?`Completed. Next visit ${fd(nx.d)}`:'Completed',()=>{j.x=o;if(nx)S.jb=S.jb.filter(y=>y!==nx)})},
reopen(id){const j=S.jb.find(x=>x.id===id),o=j.x;j.x='';save();render();toast('Moved back to open',()=>{j.x=o})},
renew(id){const r=S.rn.find(x=>x.id===id),od=r.d,ox=r.x;if(r.sid)return toast('Renew this contract in SimPro');r.d=addM(dd(r.d)<0?iso(0):r.d,12);r.x=iso(0);save();render();toast(`Renewed to ${fd(r.d)}`,()=>{r.d=od;r.x=ox})},
new(k){form(k)},edit(k,id){const o=S[k==='job'?'jb':'rn'].find(x=>x.id===id);if(o&&o.sid)return toast('Synced from SimPro. Edit it there');form(k,id)},sync(){sync()},
save(k,id){const o=id?S[k==='job'?'jb':'rn'].find(x=>x.id===id):{id:uid()};for(const f of FLD[k]){let v=$('#f_'+f[0]).value;o[f[0]]=f[2]==='number'?+v||0:v}
if(!o.c||!o.d)return toast('Customer and date are required');if(k==='job'){o.f=+o.f;o.x=o.x||'';if(!o.s)o.s='-'}else o.x=o.x||'';if(!id)S[k==='job'?'jb':'rn'].push(o);S.tab=k==='job'?(dd(o.d)<0?'od':'up'):'rn';$('#dlg').close();save();render()},
del(k,id){const a=k==='job'?'jb':'rn',o=S[a].find(x=>x.id===id);S[a]=S[a].filter(x=>x!==o);$('#dlg').close();save();render();toast('Deleted',()=>{S[a].push(o)})}};
const FLD={job:[['c','Customer','text'],['s','Site','text'],['u','Unit or asset','text'],['t','Service type','select',TY],['d','Due date','date'],['f','Repeats','select',[[0,'One-off'],[3,'Every 3 months'],[6,'Every 6 months'],[12,'Every 12 months']]],['e','Engineer (optional)','text'],['n','Notes','textarea']],
rn:[['c','Customer','text'],['n','Contract','text'],['d','Renewal date','date'],['v','Annual value (£)','number'],['nt','Notes','textarea']]};
function form(k,id){const o=id?S[k==='job'?'jb':'rn'].find(x=>x.id===id):{d:iso(k==='job'?7:60),f:6,t:TY[0]};
const fh=f=>{const v=o[f[0]]===undefined?'':o[f[0]],i=`id="f_${f[0]}"`;return`<label for="f_${f[0]}">${f[1]}</label>`+(f[2]==='select'?`<select ${i}>${f[3].map(x=>{const a=Array.isArray(x)?x:[x,x];return`<option value="${a[0]}" ${String(a[0])===String(v)?'selected':''}>${a[1]}</option>`}).join('')}</select>`:f[2]==='textarea'?`<textarea ${i} rows="2">${v}</textarea>`:`<input ${i} type="${f[2]}" value="${v}" ${f[2]==='number'?'inputmode="decimal"':''}>`)};
$('#dlg').innerHTML=`<h2>${id?'Edit':'New'} ${k==='job'?'service job':'renewal'}</h2>${FLD[k].map(fh).join('')}<div class="btns">${id?`<button class="go del" data-a="del:${k}:${id}">Delete</button>`:''}<button class="go g2" onclick="dlg.close()">Cancel</button><button class="go" data-a="save:${k}${id?':'+id:''}">Save</button></div>`;$('#dlg').showModal()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t){const p=t.dataset.a.split(':');A[p[0]](...p.slice(1))}});
$('#q').addEventListener('input',render);render();
const EP='/.netlify/functions/simpro',ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){}};
async function api(body){const r=await fetch(EP,{method:body?'POST':'GET',headers:{'content-type':'application/json','x-app-key':ls('fa-key')||''},body:body?JSON.stringify(body):undefined});
if(r.status===401){const n=prompt('Access key');if(n){ls('fa-key',n);return api(body)}throw Error('Access key needed')}if(!r.ok)throw Error((await r.text()).slice(0,120)||r.status);return r.json()}
async function sync(quiet){if(busy)return;busy=1;$('#ss').textContent='Syncing with SimPro…';try{const d=await api();
const ex=Object.fromEntries(S.jb.filter(j=>j.sid).map(j=>[j.sid,j.id]));
S.jb=S.jb.filter(j=>!j.sid).concat(d.jobs.map(j=>{const x=j.x||S.ov[j.sid]||'';if(j.x)delete S.ov[j.sid];return{...j,id:ex[j.sid]||'sp'+j.sid,x,f:0,e:'',n:''}}));
if(d.renewals&&d.renewals.length)S.rn=S.rn.filter(r=>!r.sid).concat(d.renewals.map(r=>({...r,id:'sr'+r.sid,x:''})));
S.at=d.at;busy=0;save();render();if(!quiet)toast(`Synced ${d.jobs.length} jobs`)}catch(e){busy=0;render();$('#ss').textContent='Sync failed: '+e.message}}
sync(true);setInterval(()=>sync(true),3e5);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-new Date(S.at||0)>6e4)sync(true)});

</script></body></html>
